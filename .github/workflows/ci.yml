name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: brodogfyld
          POSTGRES_USER: brodogfyld
          POSTGRES_PASSWORD: brodogfyld
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brodogfyld"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/brodogfyld?user=brodogfyld&password=brodogfyld

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon
